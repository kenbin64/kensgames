name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [14, 18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests (no deps)
        run: node bfx-ingest.test.js
      - name: Smoke-run the CLI on itself
        run: node bfx-ingest.js . --format md --out /tmp/self.md && head -5 /tmp/self.md

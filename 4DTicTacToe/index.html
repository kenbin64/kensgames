<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4D Connect — KensGames</title>
  <link rel="icon" href="/assets/images/logo/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lib/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/lib/control-rail.css">
  <style>
    :root {
      --kg-header-h: 48px;
    }
  </style>

  <!-- X-Dimensional Session Bridge -->
  <script src="/js/dimensional-session-bridge.js"></script>
  <script src="/js/kernel-client.js" defer></script>
  <script src="/js/player-panel.js" defer></script>
</head>

<body>
  <header id="kg-header">
    <a href="/" class="rail-brand">KG</a>
    <div class="rail-players">
      <div class="rail-chip" id="panel-p1">
        <div class="rail-badge p1-badge pulse" id="badge-p1">1</div>
        <span class="rail-name" id="name-p1">P1</span>
        <span class="rail-score p1-score" id="score-p1">0</span>
      </div>
      <div class="rail-chip" id="panel-p2">
        <div class="rail-badge p2-badge" id="badge-p2">2</div>
        <span class="rail-name" id="name-p2">P2</span>
        <span class="rail-score p2-score" id="score-p2">0</span>
      </div>
      <div class="rail-chip" style="display:none" id="panel-p3">
        <div class="rail-badge p3-badge" id="badge-p3">3</div>
        <span class="rail-name" id="name-p3">P3</span>
        <span class="rail-score p3-score" id="score-p3">0</span>
      </div>
      <div class="rail-chip" style="display:none" id="panel-p4">
        <div class="rail-badge p4-badge" id="badge-p4">4</div>
        <span class="rail-name" id="name-p4">P4</span>
        <span class="rail-score p4-score" id="score-p4">0</span>
      </div>
    </div>
    <div class="rail-center">
      <span id="scenario-tag">CLASSIC</span>
      <span class="rail-sep">&middot;</span>
      <span id="turn-indicator" style="color:var(--cyan)">&#9899; P1</span>
    </div>
    <div id="turn-timer" class="rail-timer"></div>
  </header>
  <canvas id="c"></canvas>
  <aside id="kg-rail">
    <button class="btn-ghost on" id="btn-cama" onclick="setCam('A')">CAM A</button>
    <button class="btn-ghost" id="btn-camb" onclick="setCam('B')">CAM B</button>
    <button class="btn-ghost" id="btn-follow" onclick="toggleFollow()">FOLLOW</button>
    <button class="btn-ghost" onclick="resetCam()">RESET</button>
    <span class="kg-rail-grow"></span>
    <button class="btn-orient" id="btn-orient" hidden onclick="snapToUpright()">&#8679; ORIENT</button>
    <span class="kg-rail-grow"></span>
    <button class="btn-ghost" onclick="if(confirm('Leave this game?'))window.location.href='/'">&#215; LEAVE</button>
  </aside>







  <div id="turn-announce"></div>
  <div id="mp-panel-overlay"
    style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,8,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:6px;overflow:hidden;">
    <div id="mp-panel-host" style="width:100%;max-width:980px;height:min(99dvh,99vh);margin:0 auto;"></div>
  </div>
  <div id="result-overlay">
    <div id="result-title"></div>
    <div id="result-line"></div>
    <div id="result-tally"></div>
    <div class="r-btn-row">
      <button class="r-btn ok" onclick="rematch()">REMATCH</button>
      <button class="r-btn alt" onclick="openMultiplayerPanel()">NEW MATCH</button>
    </div>
  </div>
  <div id="preloader">
    <div class="pre-spinner" id="pre-spinner" aria-hidden="true"></div>
    <div class="pre-t">4D CONNECT</div>
    <div class="pre-s" id="pre-msg">INITIALISING UNIVERSE...</div>
    <div class="pre-bar-w">
      <div class="pre-bar" id="pre-bar"></div>
    </div>
  </div>
  <!-- Lightweight profile gate: prompts for name + avatar on first visit. -->
  <div id="kg-player" data-profile-required="true" hidden></div>

  <script src="/lib/control-rail.js"></script>
  <script src="/js/manifold_bridge.js"></script>
  <script src="/js/substrates/avatar_picker.js"></script>
  <script src="/js/substrates/player_profile.js"></script>
  <script src="/js/multiplayer-client.js?v=20260507c"></script>
  <script src="/js/substrates/multiplayer_panel.js?v=20260501c"></script>
  <script src="/js/substrates/game_manager.js?v=20260507d"></script>
  <script src="/js/substrates/game_setup.js?v=20260429a"></script>
  <script src="/js/substrates/winki_substrate.js"></script>
  <script>
    // Warm the rules cache so the manager can enforce gameplay rules later.
    if (window.KGGameManager && typeof window.KGGameManager.loadRules === 'function') {
      window.KGGameManager.loadRules('4dtictactoe').catch(() => { /* offline-safe */ });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="manifold.js?v=20260429c"></script>
  <script src="game.js?v=20260510a"></script>



  <style>
    #orientation-guard-4d {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 12, 0.94);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    #orientation-guard-4d .og-card {
      width: min(92vw, 420px);
      border: 1px solid rgba(0, 200, 255, 0.45);
      border-radius: 14px;
      background: rgba(10, 20, 40, 0.92);
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.25);
      padding: 18px;
      color: #d6ecff;
      font-family: 'Orbitron', monospace;
    }

    #orientation-guard-4d .og-title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #7fd9ff;
      margin-bottom: 8px;
    }

    #orientation-guard-4d .og-copy {
      font-size: 11px;
      line-height: 1.5;
      color: #b8d5f0;
      margin-bottom: 12px;
    }

    #orientation-guard-4d .og-btn {
      border: 1px solid rgba(0, 210, 255, 0.6);
      background: rgba(0, 110, 150, 0.32);
      color: #9be8ff;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1.4px;
      cursor: pointer;
    }
  </style>
  <div id="orientation-guard-4d" aria-live="polite">
    <div class="og-card">
      <div class="og-title">ROTATE TO LANDSCAPE</div>
      <div class="og-copy">4D Connect is designed for horizontal play so the full cube stays inside view.</div>
      <button id="orientation-guard-4d-btn" class="og-btn" type="button">ENTER LANDSCAPE</button>
    </div>
  </div>
  <script>
    (function enforceLandscape4D() {
      const guard = document.getElementById('orientation-guard-4d');
      const btn = document.getElementById('orientation-guard-4d-btn');
      const setupOverlay = document.getElementById('mp-panel-overlay');
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || ('ontouchstart' in window && Math.min(window.innerWidth, window.innerHeight) < 900);

      async function tryLockLandscape() {
        try {
          if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          }
        } catch (_) { }
        try {
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (_) { }
      }

      function updateGuard() {
        if (!isMobile) {
          guard.style.display = 'none';
          return;
        }

        const setupOpen = !!(setupOverlay && setupOverlay.style.display !== 'none');
        if (setupOpen) {
          guard.style.display = 'none';
          return;
        }

        const portrait = window.innerHeight > window.innerWidth;
        guard.style.display = portrait ? 'flex' : 'none';
      }

      btn.addEventListener('click', async () => {
        await tryLockLandscape();
        updateGuard();
      });

      window.addEventListener('orientationchange', updateGuard);
      window.addEventListener('resize', updateGuard);
      document.addEventListener('fullscreenchange', updateGuard);
      updateGuard();
    })();
  </script>
</body>

</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast Track</title>
  <!-- Fast Track now runs on the v2 engine (the turn relinquishes on the logical move, not the
       animation, so turns can no longer be skipped by a stalled hop). Every launch is forwarded to
       3d-v2.html with its query string and hash intact. The previous build is preserved at
       3d-v1.html; append ?engine=v1 here to reach it (rollback / reference). -->
  <meta http-equiv="refresh" content="0; url=3d-v2.html">
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.get('engine') === 'v1' || p.has('v1')) {
          location.replace('3d-v1.html' + location.search + location.hash);
          return;
        }
      } catch (e) {}
      location.replace('3d-v2.html' + location.search + location.hash);
    })();
  </script>
</head>
<body style="background:#0a0a14;color:#8a93a6;font-family:system-ui,sans-serif">
  <noscript><a href="3d-v2.html" style="color:#c9a24c">Enter Fast Track</a></noscript>
</body>
</html>

# ─────────────────────────────────────────────────────────────────────────────
# BUTTERFLYFX.US — nginx HTTPS (post-SSL)
# Domain : butterflyfx.us  (172.81.62.217)
# SSL    : Let's Encrypt via certbot
# Install: sudo cp butterflyfx.us.conf /etc/nginx/sites-enabled/butterflyfx.us
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name butterflyfx.us www.butterflyfx.us;

    location /.well-known/acme-challenge/ {
        root /var/www/butterflyfx.us/public;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name butterflyfx.us www.butterflyfx.us;

    ssl_certificate     /etc/letsencrypt/live/butterflyfx.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/butterflyfx.us/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options   nosniff;
    add_header X-Frame-Options          DENY;
    add_header X-XSS-Protection         "1; mode=block";
    add_header Referrer-Policy          strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    access_log /var/log/nginx/butterflyfx.access.log;
    error_log  /var/log/nginx/butterflyfx.error.log;

    root /var/www/butterflyfx.us/public;
    index index.html;

    # Auth endpoints: proxy to the existing Manifold auth server
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    # Ollama API proxy — browser → nginx → local Ollama
    location ^~ /api/ollama/ {
        rewrite ^/api/ollama/(.*) /$1 break;
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
